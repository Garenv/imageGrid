version: 0.0
os: linux
files:
  - source: /
    destination: /var/www/imageGrid
    overwrite: true  # ensure that existing files are overwritten
file_exists_behavior: OVERWRITE  # apply the overwrite behavior
hooks:
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 300
      runas: root
  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 300
      runas: root
